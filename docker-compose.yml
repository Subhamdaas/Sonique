services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://sonique:sonique_password@postgres:5432/sonique
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=sonique_dev_jwt_secret_key_2026
      - JWT_REFRESH_SECRET=sonique_dev_refresh_jwt_secret_key_2026
    depends_on:
      - postgres
      - redis
    volumes:
      - api-uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonique
      POSTGRES_USER: sonique
      POSTGRES_PASSWORD: sonique_password
    ports:
      - "5432:5432"
    volumes:
      - sonique-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sonique-redis:/data

volumes:
  sonique-postgres:
  sonique-redis:
  api-uploads:
