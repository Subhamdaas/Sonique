services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://aura:aura_password@postgres:5432/aura
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=aura_stream_dev_jwt_secret_key_2026
      - JWT_REFRESH_SECRET=aura_stream_dev_refresh_jwt_secret_key_2026
    depends_on:
      - postgres
      - redis
    volumes:
      - api-uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura_password
    ports:
      - "5432:5432"
    volumes:
      - aura-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aura-redis:/data

volumes:
  aura-postgres:
  aura-redis:
  api-uploads:
